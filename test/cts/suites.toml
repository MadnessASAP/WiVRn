"XR_EXT_future" = { tests = ["WiVRn.XR_EXT_future"] }
"XR_EXT_hand_interaction" = { tests = ["xrSuggestInteractionProfileBindings_avail*"] }
"XR_EXT_hand_tracking" = { tests = ["XR_EXT_hand_tracking-*", "WiVRn.XR_EXT_hand_tracking"] }
